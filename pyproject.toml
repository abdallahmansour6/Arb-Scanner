[project]
name = "arb-scanner"
version = "0.1.0"
description = "Funding-rate and basis anomaly scanner for crypto perp-perp arbitrage"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "streamlit>=1.30",
    "plotly>=5.20",
]

[project.optional-dependencies]
research = [
    "jupyter",
    "marimo",
    "scipy",
    "scikit-learn",
    "statsmodels",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat scripts, not a library — disable package auto-discovery.
[tool.setuptools]
py-modules = []
